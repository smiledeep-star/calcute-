<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body> 
  <div class="card">
    <div class="display"></div>
    <div class="buttons">
      <button class="ubtn" onclick="currentValue=' ';
      document.querySelector('.display').innerText=currentValue;">AC</button>
      <button class="nobtn" onclick="currentValue=currentValue+'1';
      document.querySelector('.display').innerText=currentValue;">1</button>
      <button class="nobtn" onclick="currentValue=currentValue+'2';
      document.querySelector('.display').innerText=currentValue;">2</button>
      <button class="obtn" onclick="currentValue=currentValue+'+';
      document.querySelector('.display').innerText=currentValue;">+</button>
      <button class="nobtn" onclick="currentValue=currentValue+'3';
      document.querySelector('.display').innerText=currentValue;">3</button>
      <button class="nobtn" onclick="currentValue=currentValue+'4';
      document.querySelector('.display').innerText=currentValue;">4</button>
      <button class="obtn" onclick="currentValue=currentValue+'-';
      document.querySelector('.display').innerText=currentValue;">-</button>
      <button class="nobtn" onclick="currentValue=currentValue+'5';
      document.querySelector('.display').innerText=currentValue;">5</button>
      <button class="nobtn" onclick="currentValue=currentValue+'6';
      document.querySelector('.display').innerText=currentValue;">6</button>
      <button class="obtn" onclick="currentValue=currentValue+'*';
      document.querySelector('.display').innerText=currentValue;">*</button>
      <button class="nobtn" onclick="currentValue=currentValue+'7';
      document.querySelector('.display').innerText=currentValue;">7</button>
      <button class="nobtn" onclick="currentValue=currentValue+'8';
      document.querySelector('.display').innerText=currentValue;">8</button>
      <button class="obtn" onclick="currentValue=currentValue+'/';
      document.querySelector('.display').innerText=currentValue;">/</button>
      <button class="obtn" onclick="currentValue=currentValue+'%';
      document.querySelector('.display').innerText=currentValue;">%</button>
      <button class="nobtn" onclick="currentValue=currentValue+'9';
      document.querySelector('.display').innerText=currentValue;">9</button>
      <button class="nobtn" onclick="currentValue=currentValue+'0';
      document.querySelector('.display').innerText=currentValue;">0</button>
      <button class="ebtn" onclick="
      let result=eval(currentValue);
      currentValue=result;
      document.querySelector('.display').innerText=currentValue;">=</button>
     </div>
</div>
  
  <script>
    currentValue='';
    document.querySelector('.display').innerText=currentValue;
  </script>
  
</body>
</html>
